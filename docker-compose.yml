services:
  app:
    image: ${APP_IMAGE:-workshop-organizer:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/workshopsdb"
      SPRING_DATASOURCE_USERNAME: workshops_user
      SPRING_DATASOURCE_PASSWORD: oc2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:5
    # Wait fiable + démarrage (fonctionne avec ton image alpine)
    command: >
      sh -c "
        echo '⏳ Waiting for PostgreSQL (db:5432)...' &&
        until pg_isready -h db -p 5432 -U workshops_user -d workshopsdb; do
          sleep 2;
        done &&
        echo '✅ PostgreSQL ready ! Starting app...' &&
        java -jar app.jar
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  db:
    image: postgres:13
    container_name: workshop-db
    environment:
      POSTGRES_USER: workshops_user
      POSTGRES_PASSWORD: oc2026
      POSTGRES_DB: workshopsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshops_user -d workshopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: