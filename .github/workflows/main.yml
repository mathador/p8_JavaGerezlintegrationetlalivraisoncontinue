name: CI

# Déclencheurs: push et pull_request sur les branches ciblées
on:
  push:
    branches: [ main, exercice2_etape2 ]
  pull_request:
    branches: [ main, exercice2_etape2 ]

jobs:
  build:
    # Exécute le job sur un runner Ubuntu récent
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - name: Checkout
        uses: actions/checkout@v4

      # Installe le JDK requis (Temurin 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Met en cache les fichiers Gradle pour accélérer les builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Assure l'exécution du wrapper Gradle sous Linux
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # Lance la compilation et les tests via Gradle
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Téléverse les artefacts de build (si succès)
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs
