name: CI

# Déclencheurs: sur les évenements push et pull_request sur les branches ciblées
on:
  push:
    branches: [ main, exercice2_etape2 ]
  pull_request:
    branches: [ main, exercice2_etape2 ]

jobs:
  # Pour l'instant 2 jobs : build et test
  build:
    # Exécute le job sur un runner Ubuntu récent
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - name: Checkout
        uses: actions/checkout@v4

      # Installe le JDK requis (Temurin 21)
      - name: Set up JDK 21
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Met en cache les fichiers Gradle pour accélérer les builds
      - name: Cache Gradle
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Assure l'exécution du wrapper Gradle sous Linux
      - name: Ensure Gradle wrapper is executable
        if: hashFiles('**/build.gradle*') != ''
        run: chmod +x ./gradlew

      # Lance la compilation et les tests via Gradle
      - name: Build with Gradle
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew build --no-daemon

      # Angular
      - name: Set up Node.js
        if: hashFiles('**/angular.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Angular
        if: hashFiles('**/angular.json') != ''
        run: |
          npm install
          npx ng build

  test:
    # Job de test séparé
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run tests script
        run: python run-tests.py

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()   # exécuter même si les tests échouent
        with:
          files: |
            build/test-results/test/**/*.xml
            test-results/**/*.xml
