name: CI

# Déclencheurs: sur les évenements push et pull_request sur les branches ciblées
on:
    push:
        branches: [main, exercice2_etape2, test]
    pull_request:
        branches: [main, exercice2_etape2, test]

permissions:
    contents: read
    packages: write
#
env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # Pour l'instant 2 jobs : build et test
    build:
        # Exécute le job sur un runner Ubuntu récent
        runs-on: ubuntu-latest
        steps:
            # Récupère le code du dépôt
            - name: Checkout
              uses: actions/checkout@v4

            # Installe le JDK requis (Temurin 21)
            - name: Set up JDK 21
              if: hashFiles('**/build.gradle*') != ''
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"

            # Met en cache les fichiers Gradle pour accélérer les builds
            - name: Cache Gradle
              if: hashFiles('**/build.gradle*') != ''
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            # Assure l'exécution du wrapper Gradle sous Linux
            - name: Ensure Gradle wrapper is executable
              if: hashFiles('**/build.gradle*') != ''
              run: chmod +x ./gradlew

            # Lance la compilation et les tests via Gradle
            - name: Build with Gradle
              if: hashFiles('**/build.gradle*') != ''
              run: ./gradlew build --no-daemon

            # Angular
            - name: Set up Node.js
              if: hashFiles('**/angular.json') != ''
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Build Angular
              if: hashFiles('**/angular.json') != ''
              run: |
                  npm install
                  npx ng build

    test:
        # Job de test séparé
        runs-on: ubuntu-latest
        needs: [build]
        permissions:
            checks: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install Python dependencies (if present)
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

            - name: Ensure Gradle wrapper is executable
              if: hashFiles('**/build.gradle*') != ''
              run: chmod +x ./gradlew

            - name: Run tests script
              run: python run-tests.py

            - name: Publish Test Report
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: always() # exécuter même si les tests échouent
              with:
                  files: |
                      build/test-results/test/**/*.xml
                      test-results/**/*.xml

    publish:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              if: hashFiles('**/angular.json') != ''
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Build Angular (for Docker context)
              if: hashFiles('**/angular.json') != ''
              run: |
                  npm install
                  npx ng build

            - name: Set Docker image tags
              if: hashFiles('**/angular.json') != ''
              run: |
                  BRANCH_NAME=${GITHUB_REF#refs/heads/}
                  BRANCH_NAME=${BRANCH_NAME//\//-}
                  BRANCH_NAME=$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]')
                  SHORT_SHA=${GITHUB_SHA:0:5}
                  IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
                  IMAGE_TAG=$(echo "${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
                  echo "IMAGE_FULL=${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_ENV
                  echo "IMAGE_FULL_SHA=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> $GITHUB_ENV

            - name: Docker info & buildx version (debug)
              if: hashFiles('**/angular.json') != ''
              run: |
                  docker info || true
                  docker buildx version || true
                  echo "IMAGE_FULL=${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

            - name: Login to GitHub Container Registry
              if: hashFiles('**/angular.json') != ''
              uses: docker/login-action@v2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: To Lowercase (for Docker tags)
              if: hashFiles('**/angular.json') != ''
              run: |
                  echo "IMAGE_FULL_SHA_LC=$(echo '${{ env.IMAGE_FULL_SHA }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
                  echo "IMAGE_FULL_SHA_LC = ${{ env.IMAGE_FULL_SHA_LC }}
                  echo "IMAGE_FULL_LC=$(echo '${{ env.IMAGE_FULL }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
                  echo "IMAGE_FULL_LC = ${{ env.IMAGE_FULL_LC }}

            - name: Build and push Docker image
              if: hashFiles('**/angular.json') != ''
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_FULL_SHA_LC }}
                      ${{ env.IMAGE_FULL_LC }}
