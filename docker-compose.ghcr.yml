services:
  app:
    image: ghcr.io/mathador/p8_javagerezlintegrationetlalivraisoncontinue:test-10a27
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/workshopsdb"
      SPRING_DATASOURCE_USERNAME: workshops_user
      SPRING_DATASOURCE_PASSWORD: oc2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: workshops_user
      POSTGRES_DB: workshopsdb
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ >/dev/null 2>&1 && pg_isready -h db -p 5432 -U workshops_user -d workshopsdb >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: workshops_user
      POSTGRES_PASSWORD: oc2026
      POSTGRES_DB: workshopsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshops_user -d workshopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

